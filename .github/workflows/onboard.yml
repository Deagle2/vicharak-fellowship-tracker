name: onboard-join-request
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: write

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'join-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate join request + comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf '%s' "$ISSUE_BODY" > /tmp/body.md
          python scripts/validate_join.py --body /tmp/body.md --fellows fellows.csv --author "$ISSUE_AUTHOR" > /tmp/out.json
          cat /tmp/out.json
          python -c "import json; open('/tmp/comment.md','w').write(json.load(open('/tmp/out.json'))['comment'])"
          OK=$(python -c "import json; print(str(json.load(open('/tmp/out.json'))['ok']).lower())")
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment.md
          if [ "$OK" = "true" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "join-valid" --remove-label "join-invalid" || gh issue edit "$ISSUE_NUMBER" --add-label "join-valid"
          else
            gh issue edit "$ISSUE_NUMBER" --add-label "join-invalid" --remove-label "join-valid" || gh issue edit "$ISSUE_NUMBER" --add-label "join-invalid"
          fi

  invite:
    # Admin accepts by adding `approved` label (name must already be valid)
    if: contains(github.event.issue.labels.*.name, 'approved')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Re-validate + invite issue author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONBOARD_PAT: ${{ secrets.ONBOARD_PAT }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          printf '%s' "$ISSUE_BODY" > /tmp/body.md
          python scripts/validate_join.py --body /tmp/body.md --fellows fellows.csv --author "$ISSUE_AUTHOR" > /tmp/out.json
          cat /tmp/out.json
          OK=$(python -c "import json; print(str(json.load(open('/tmp/out.json'))['ok']).lower())")
          NAME=$(python -c "import json; print(json.load(open('/tmp/out.json'))['full_name'])")
          if [ "$OK" != "true" ]; then
            printf 'Cannot invite @%s yet - join check FAILED. Fix name/proof first, then re-add `approved`.' "$ISSUE_AUTHOR" > /tmp/msg.md
            gh issue comment "$ISSUE_NUMBER" --body-file /tmp/msg.md
            gh issue edit "$ISSUE_NUMBER" --remove-label "approved" || true
            exit 0
          fi
          if [ -z "$ONBOARD_PAT" ]; then
            {
              echo "VALIDATED @$ISSUE_AUTHOR ($NAME) - ready to invite."
              echo ""
              echo "No ONBOARD_PAT secret set, so admin: run this once:"
              echo '```'
              echo "gh api -X PUT repos/$REPO/collaborators/$ISSUE_AUTHOR -f permission=push"
              echo '```'
              echo "Then close this issue as completed."
            } > /tmp/msg.md
            gh issue comment "$ISSUE_NUMBER" --body-file /tmp/msg.md
            exit 0
          fi
          GH_TOKEN="$ONBOARD_PAT" gh api -X PUT "repos/$REPO/collaborators/$ISSUE_AUTHOR" -f permission=push
          printf 'Invited @%s (%s) with edit (push) access. Accept via email/notifications. Welcome!' "$ISSUE_AUTHOR" "$NAME" > /tmp/msg.md
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/msg.md
