name: attribute-pr-author
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'submissions/**'

permissions:
  pull-requests: write

jobs:
  attribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Attribute PR author to fellow + comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'EOF' > /tmp/msg.md
          import csv, json, re
          def users(raw):
              out = []
              for part in re.split(r"[,;\s]+", raw or ""):
                  part = part.strip().strip("<>").rstrip("/")
                  if not part:
                      continue
                  m = re.search(r"github\.com/([A-Za-z0-9-]+)", part, re.IGNORECASE)
                  u = m.group(1).lower() if m else part.lstrip("@").lower()
                  if u not in out:
                      out.append(u)
              return out
          fellows, gmap = {}, {}
          with open("fellows.csv", encoding="utf-8") as f:
              for row in csv.DictReader(f):
                  n = (row.get("Full name") or "").strip()
                  if not n:
                      continue
                  key = re.sub(r"\s+", " ", n).lower()
                  fellows.setdefault(key, re.sub(r"\s+", " ", n).strip())
                  for u in users(row.get("Github") or ""):
                      gmap.setdefault(u, key)
          import os
          try:
              ov = json.load(open("github_overrides.json", encoding="utf-8"))
              for user, name in (ov or {}).items():
                  if str(user).startswith("_") or str(user) == "example_user_do_not_use":
                      continue
                  key = re.sub(r"\s+", " ", str(name)).lower()
                  if key in fellows:
                      gmap[str(user).strip().lstrip("@").lower()] = key
          except FileNotFoundError:
              pass
          # Kit status from last merged summary (source of truth for score list)
          kitmap = {}
          try:
              with open("allocations/summary.csv", encoding="utf-8") as f:
                  for row in csv.DictReader(f):
                      n = (row.get("Fellow") or "").strip()
                      if not n:
                          continue
                      key = re.sub(r"\s+", " ", n).lower()
                      kitmap[key] = (row.get("PurchaseProof") or "NO").strip().upper()
          except FileNotFoundError:
              pass
          author = os.environ.get("PR_AUTHOR", "").lower()
          title = os.environ.get("PR_TITLE", "")
          is_proof = "purchaseproof" in title.lower().replace(" ", "").replace("-", "")
          key = gmap.get(author)
          if key:
              name = fellows[key]
              kit = kitmap.get(key, "NO")
              print(f"PR opened by @{author} - attributed to **{name}**. Points from merged files go to that name. Admin: verify each JSON's `fellow` matches (CI fails on mismatch).")
              print(f"Kit status (score list): **{kit}**.")
              if kit == "NO" and not is_proof:
                  print("WARNING: Kit = NO and this PR is NOT PurchaseProof -> per rule first PR must be proof. Admin: close/reject unless proof is merged first.")
              elif kit == "NO" and is_proof:
                  print("This is a PurchaseProof PR with Kit = NO -> review proof link, merge flips Kit to YES.")
              elif kit == "YES":
                  print("Kit = YES -> normal review: open link, verify it matches claimed type, then Approve + Merge.")
          else:
              print(f"PR opened by @{author} - **no fellow mapping found** (not in fellows.csv sheet URLs or github_overrides.json).")
              print("Student: add your GitHub URL to the Fellowship sheet or ask admin to map it in `github_overrides.json`. Ensure JSON `fellow` is your exact sheet name.")
              print("Kit status: UNKNOWN (no mapping) - Admin: verify identity before merging.")
          EOF
          cat /tmp/msg.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/msg.md
